<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="theme-color"
    content="#0b1220"
  />

  <title>GeoGuessr</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <script
    src="script.js"
    defer
  ></script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAj5aRYPAHtUK4W9g1EbUkVm5rpgV6rUU&libraries=geometry&callback=initGame"
    defer
  ></script>
</head>

x`<body>
  <main class="game-shell">

    <div 
      id="compass"
      class="compass"
      aria-label="Compass"
    >
      <div
        id="compassNeedle"
        class="compass-needle"
      >
        N
      </div>
    </div>

    <div
      id="street-view"
      class="street-view"
      aria-label="Street View"
    ></div>

    <header class="top-bar">
      <div class="brand">GeoGuessr</div>

      <div
        class="hud"
        aria-label="Game status"
      >
        <span id="roundDisplay">Round 1 / 5</span>
        <span class="hud-divider"></span>
        <span id="scoreDisplay">0 pts</span>
      </div>
    </header>

    <div
      id="message"
      class="message"
      aria-live="polite"
    >
      Loading Street View…
    </div>

    <aside
      id="guessPanel"
      class="guess-panel"
      aria-label="Guess map"
    >
      <div
        id="map"
        class="guess-map"
      ></div>

      <button
        id="guessBtn"
        class="primary-button"
        type="button"
        disabled
      >
        Guess
      </button>
    </aside>

    <section
      id="resultOverlay"
      class="result-overlay is-hidden"
      aria-live="polite"
    >
      <div class="result-card">
        <div
          id="resultMap"
          class="result-map"
        ></div>

        <div class="result-summary">
          <div class="result-stat">
            <span class="result-label">Distance</span>
            <strong id="resultDistance">0.00 km</strong>
          </div>

          <div class="result-stat">
            <span class="result-label">Round score</span>
            <strong id="resultScore">0 pts</strong>
          </div>

          <div class="result-stat">
            <span class="result-label">Total</span>
            <strong id="resultTotalScore">0 / 25,000</strong>
          </div>

          <button
            id="nextBtn"
            class="primary-button result-next"
            type="button"
          >
            Next Round
          </button>
        </div>
      </div>
    </section>

    <section
      id="finalOverlay"
      class="final-overlay is-hidden"
      aria-live="polite"
    >
      <div class="final-card">
        <p class="final-kicker">5 rounds complete</p>

        <h1>Final Score</h1>

        <p
          id="finalScore"
          class="final-score"
        >
          0 / 25,000
        </p>

        <button
          id="playAgainBtn"
          class="primary-button"
          type="button"
        >
          Play Again
        </button>
      </div>
    </section>

  </main>
</body>
</html>
